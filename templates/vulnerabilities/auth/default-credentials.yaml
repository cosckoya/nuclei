id: cosckoya-vulnerability-default-credentials

info:
  name: Default Credentials Check
  author: cosckoya
  severity: high
  description: |
    Checks for default credentials on common services and applications.
    Tests commonly used username/password combinations.
  reference:
    - https://owasp.org/www-community/attacks/Use_of_default_credentials
  tags: vulnerability,default-credentials,auth,bruteforce
  metadata:
    max-request: 10

http:
  - method: POST
    path:
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/auth"
      - "{{BaseURL}}/signin"

    body: "username=admin&password=admin"
    headers:
      Content-Type: application/x-www-form-urlencoded

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "dashboard"
          - "welcome"
          - "admin"
          - "success"
        part: body
        condition: or
      - type: status
        status:
          - 200
          - 302

    extractors:
      - type: regex
        part: header
        name: set-cookie
        regex:
          - "(?i)set-cookie: (.+)"
        group: 1
