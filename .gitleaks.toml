[rules]
# Gitleaks configuration for cosckoya/nuclei
# Scans for secrets, API keys, tokens, and passwords in repository

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = "(?i)aws(.{0,20})?(04[A-Z0-9]+|AKIA[0-9A-Z]{16})"
secret-group = 2

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = "(?i)aws(.{0,20})?[0-9a-zA-Z/+]{40}"
secret-group = 0

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = "(?i)github(.{0,20})?(?:0|1|[2-9]|[a-f])[0-9a-zA-Z]{35,40}"
secret-group = 0

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = "(?i)(api[_-]?key|apikey|api_secret|api-key|apisecret)[\"'\\s:=+]+[\"'\\s]{0,3}([A-Za-z0-9+/=]{20,})"
secret-group = 2

[[rules]]
id = "private-key"
description = "Private Key"
regex = "-----BEGIN [A-Z ]+PRIVATE KEY-----"
secret-group = 0

[[rules]]
id = "slack-token"
description = "Slack Token"
regex = "(xox[b|p|o|a|w]-[0-9]{12}-[0-9]{12}-[0-9]{12}-[a-z0-9]{32})"
secret-group = 0

[[rules]]
id = "stripe-key"
description = "Stripe API Key"
regex = "(sk|rk)_(test|live)_[0-9a-zA-Z]{24,}"
secret-group = 0

[[rules]]
id = "sendgrid-key"
description = "SendGrid API Key"
regex = "SG\\.[0-9a-zA-Z]{22}\\.[0-9a-zA-Z]{16,}"
secret-group = 0

[[rules]]
id = "twilio-key"
description = "Twilio API Key"
regex = "SK[0-9a-fA-F]{32}"
secret-group = 0

[[rules]]
id = "password-in-url"
description = "Password in URL"
regex = "(?i)(?:https?://)([^:]+):([^@]+)@"
secret-group = 2

allowlist:
  - id: "allow-test-keys"
    description: "Allow test/example keys in documentation"
    regex: "(?i)(example|test|fake|dummy|placeholder|your-key-here)"
    paths:
      - "docs/"
      - "examples/"
      - "README.md"
