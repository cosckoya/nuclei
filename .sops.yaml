# SOPS configuration for encrypted secrets in Nuclei scans
# Reference: https://github.com/getsops/sops

creation_rules:
  - path: templates/**/*.yaml
    kms: arn:aws:kms:us-east-1:123456789012:key/abcdef12-3456-7890-abcd-ef1234567890
    gcp_kms: projects/cosckoya/locations/global/keyRings/nuclei/cryptoKeys/sops-key
    age: age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq
    pgp: "cosckoya@proton.me"
    encrypted_regex: ^(password|secret|token|api_key|auth)$
    replace: false
