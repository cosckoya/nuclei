name: Template Sync from Upstream

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        type: choice
        options:
          - full
          - category
          - dry-run
        default: 'dry-run'
      category:
        description: 'Category to sync (if mode=category)'
        required: false
        default: 'cves'

env:
  UPSTREAM_REPO: https://github.com/projectdiscovery/nuclei-templates.git
  UPSTREAM_BRANCH: main
  SYNC_DIR: /tmp/opencode/nuclei-templates-upstream

jobs:
  sync:
    name: Sync Templates from projectdiscovery/nuclei-templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.27.3'

      - name: Install Nuclei
        run: |
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

      - name: Clone upstream templates
        run: |
          mkdir -p /tmp/opencode
          if [ -d ${{ env.SYNC_DIR }} ]; then
            cd ${{ env.SYNC_DIR }} && git pull origin ${{ env.UPSTREAM_BRANCH }}
          else
            git clone --depth 1 --branch ${{ env.UPSTREAM_BRANCH }} ${{ env.UPSTREAM_REPO }} ${{ env.SYNC_DIR }}
          fi

      - name: Run template sync script
        run: |
          chmod +x scripts/update-templates.sh
          scripts/update-templates.sh \
            --upstream ${{ env.SYNC_DIR }} \
            --mode ${{ github.event.inputs.mode }} \
            --category ${{ github.event.inputs.category }} \
            --dry-run ${{ contains(github.event.inputs.mode, 'dry-run') && echo 'true' || echo 'false' }}

      - name: Create sync branch and PR
        if: github.event.inputs.mode != 'dry-run'
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: sync templates from projectdiscovery/nuclei-templates

- Weekly template sync from upstream
- Auto-generated by sync-templates workflow" -m "Co-Authored-By: Roy Batty <roy.batty@cosckoya.bot>"
          git push origin "$BRANCH"
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore: sync templates from projectdiscovery/nuclei-templates $(date +%Y-%m-%d)" \
            --body "Auto-generated template sync from upstream repository.

- Source: projectdiscovery/nuclei-templates
- Mode: ${{ github.event.inputs.mode }}
- Category: ${{ github.event.inputs.category }}
- Review all templates before merging"
